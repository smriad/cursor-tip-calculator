<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tip Calculator</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --text: #1a1d26;
      --muted: #5c6478;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --border: #e2e8f0;
      --success: #059669;
    }

    [data-theme="dark"] {
      --bg: #0f1419;
      --surface: #1a2332;
      --text: #eef2ff;
      --muted: #94a3b8;
      --accent: #60a5fa;
      --accent-soft: #1e3a5f;
      --border: #334155;
      --success: #34d399;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, var(--accent-soft), var(--bg) 45%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    .card {
      width: min(420px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
    }

    .subtitle {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    button.icon {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 10px;
      padding: 0.45rem 0.65rem;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .field {
      margin-bottom: 1rem;
    }

    input[type="number"],
    input[type="range"] {
      width: 100%;
    }

    input[type="number"] {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 10px;
      padding: 0.65rem 0.75rem;
      font-size: 1rem;
    }

    input[type="number"]:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .tip-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.35rem;
    }

    .tip-value {
      font-weight: 700;
      color: var(--accent);
    }

    .tip-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .tip-presets button {
      flex: 1;
      min-width: 3.5rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 999px;
      padding: 0.35rem 0.5rem;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .tip-presets button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .results {
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px dashed var(--border);
      display: grid;
      gap: 0.65rem;
    }

    .row {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
    }

    .row.total {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--success);
      margin-top: 0.25rem;
    }

    .row.per-person {
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <header>
      <div>
        <h1>Tip Calculator</h1>
        <p class="subtitle">Split the bill fairly in seconds.</p>
      </div>
      <button type="button" class="icon" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
    </header>

    <form id="calcForm" onsubmit="return false;">
      <div class="field">
        <label for="bill">Bill amount</label>
        <input id="bill" type="number" min="0" step="0.01" value="42.50" inputmode="decimal" />
      </div>

      <div class="field">
        <div class="tip-row">
          <label for="tip">Tip</label>
          <span class="tip-value" id="tipLabel">18%</span>
        </div>
        <input id="tip" type="range" min="0" max="40" step="1" value="18" />
        <div class="tip-presets" id="tipPresets">
          <button type="button" data-tip="10">10%</button>
          <button type="button" data-tip="15">15%</button>
          <button type="button" data-tip="18" class="active">18%</button>
          <button type="button" data-tip="20">20%</button>
          <button type="button" data-tip="25">25%</button>
        </div>
      </div>

      <div class="field">
        <label for="people">Split between (people)</label>
        <input id="people" type="number" min="1" step="1" value="2" />
      </div>
    </form>

    <section class="results" aria-live="polite">
      <div class="row"><span>Tip amount</span><span id="tipAmount">$0.00</span></div>
      <div class="row total"><span>Total</span><span id="totalAmount">$0.00</span></div>
      <div class="row per-person"><span>Each person pays</span><span id="perPerson">$0.00</span></div>
    </section>
  </main>

  <script>
    const billEl = document.getElementById("bill");
    const tipEl = document.getElementById("tip");
    const peopleEl = document.getElementById("people");
    const tipLabel = document.getElementById("tipLabel");
    const tipAmountEl = document.getElementById("tipAmount");
    const totalAmountEl = document.getElementById("totalAmount");
    const perPersonEl = document.getElementById("perPerson");
    const themeToggle = document.getElementById("themeToggle");
    const presetButtons = document.querySelectorAll("#tipPresets button");

    const currency = new Intl.NumberFormat(undefined, {
      style: "currency",
      currency: "USD",
    });

    function readNumber(input, fallback) {
      const value = Number.parseFloat(input.value);
      return Number.isFinite(value) ? value : fallback;
    }

    function updatePresets(activeTip) {
      presetButtons.forEach((btn) => {
        btn.classList.toggle("active", Number(btn.dataset.tip) === activeTip);
      });
    }

    function recalculate() {
      const bill = Math.max(0, readNumber(billEl, 0));
      const tipPercent = Math.min(40, Math.max(0, readNumber(tipEl, 0)));
      const people = Math.max(1, Math.floor(readNumber(peopleEl, 1)));

      tipLabel.textContent = `${tipPercent}%`;
      updatePresets(tipPercent);

      const tip = bill * (tipPercent / 100);
      const total = bill + tip;
      const each = total / people;

      tipAmountEl.textContent = currency.format(tip);
      totalAmountEl.textContent = currency.format(total);
      perPersonEl.textContent = currency.format(each);
    }

    function setTheme(dark) {
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      themeToggle.textContent = dark ? "☀️" : "🌙";
      localStorage.setItem("tip-calc-theme", dark ? "dark" : "light");
    }

    presetButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        tipEl.value = btn.dataset.tip;
        recalculate();
      });
    });

    [billEl, tipEl, peopleEl].forEach((el) => {
      el.addEventListener("input", recalculate);
    });

    themeToggle.addEventListener("click", () => {
      const dark = document.documentElement.dataset.theme !== "dark";
      setTheme(dark);
    });

    setTheme(localStorage.getItem("tip-calc-theme") === "dark");
    recalculate();
  </script>
</body>
</html>
